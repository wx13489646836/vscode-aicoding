<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品详情图工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1>商品详情图工作台</h1>
      <p class="version">本地演示 <strong id="version">载入中</strong></p>
    </div>
  </header>
  <p id="app-status" class="app-status" role="status"></p>
  <main id="studio" hidden>
    <nav aria-label="工作台步骤">
      <a href="#product">白底商品图</a>
      <a href="#style">选择风格</a>
      <a href="#template">设置详情图</a>
      <a href="#output">预览与下载</a>
    </nav>
    <div class="stages">
      <section id="product" class="stage">
        <h2>白底商品图</h2>
        <fieldset id="product-fields" aria-label="白底商品图">
          <div class="upload">
            <div>
              <label for="product-file">上传商品图</label>
              <input id="product-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="product-status">
              <p id="product-status" class="status" role="status">请选择 PNG、JPEG 或 WebP 格式的白底商品图。</p>
            </div>
            <img id="product-preview" alt="商品图预览" hidden>
          </div>
        </fieldset>
      </section>

      <section id="style" class="stage">
        <h2>选择风格</h2>
        <p id="style-locked" class="locked">上传商品图后可以选择风格。</p>
        <fieldset id="style-fields" aria-label="选择风格">
          <fieldset class="style-options">
            <legend>风格来源</legend>
            <label><input type="radio" name="style-source" value="prompt" checked> 文字生成</label>
            <label><input type="radio" name="style-source" value="reference"> 上传参考图</label>
          </fieldset>
          <div id="prompt-panel">
            <form id="style-form">
              <label for="style-prompt">描述想要的风格</label>
              <input id="style-prompt" type="text" maxlength="100" placeholder="例如 冷色极简、浅蓝背景、柔和棚拍光" required>
              <button type="submit">生成风格图</button>
            </form>
            <div id="style-candidates" class="candidates" aria-label="风格候选"></div>
          </div>
          <div class="upload" id="reference-panel" hidden>
            <div>
              <label for="reference-file">上传风格参考图</label>
              <input id="reference-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="reference-status">
              <p id="reference-status" class="status" role="status">从参考图提取配色，用于后续详情图。</p>
            </div>
            <img id="reference-preview" alt="风格参考图预览" hidden>
          </div>
          <p id="style-status" class="status" role="status"></p>
        </fieldset>
      </section>

      <section id="template" class="stage">
        <h2>设置详情图</h2>
        <p id="template-locked" class="locked">选定风格后可以配置每张详情图。</p>
        <form id="detail-form">
          <fieldset id="template-fields" aria-label="详情图设置">
            <label for="image-count">详情图张数</label>
            <select id="image-count"></select>
            <div id="image-settings" class="image-settings"></div>
            <button type="submit" class="primary">生成详情图</button>
          </fieldset>
        </form>
      </section>

      <section id="output" class="stage" aria-labelledby="output-title">
        <h2 id="output-title">预览与下载</h2>
        <p id="output-status" class="status" role="status">完成设置后，生成的详情图会显示在这里。</p>
        <div id="result-list" class="result-list"></div>
      </section>
    </div>
  </main>
</body>
</html>
