<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>银饰详情图工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="shell topbar">
      <h1>银饰详情图</h1>
    </div>
  </header>
  <p id="app-status" class="shell app-status" role="status"></p>
  <main id="studio" class="shell" hidden>
    <nav aria-label="制作步骤">
      <ol class="step-list">
        <li><button type="button" data-step="0"><span aria-hidden="true">01</span>商品图</button></li>
        <li><button type="button" data-step="1"><span aria-hidden="true">02</span>选风格</button></li>
        <li><button type="button" data-step="2"><span aria-hidden="true">03</span>排版与出图</button></li>
      </ol>
    </nav>
    <section id="product" class="stage" data-panel aria-labelledby="product-title">
      <h2 id="product-title" tabindex="-1">上传商品图</h2>
      <fieldset id="product-fields" class="upload" aria-label="商品图片与信息">
        <div>
          <label for="product-file">白底商品图</label>
          <input id="product-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="product-status">
          <p id="product-status" class="status" role="status">支持 PNG、JPEG、WebP。</p>
          <div class="product-details">
            <div>
              <label for="product-name">商品名称（必填）</label>
              <input id="product-name" type="text" autocomplete="off" maxlength="40" required aria-describedby="product-name-error" placeholder="填写商品名称">
              <p id="product-name-error" class="status" role="status"></p>
            </div>
            <div>
              <label for="product-info">商品信息 <span class="optional">（选填）</span></label>
              <textarea id="product-info" rows="4" autocomplete="off" maxlength="400" aria-describedby="product-info-help" placeholder="可填写材质、尺寸、工艺、卖点等，一行一项"></textarea>
              <p id="product-info-help" class="status">点击「根据模板优化」时用作详情图文案参考。</p>
            </div>
          </div>
        </div>
        <img id="product-preview" alt="已上传的商品图" hidden>
      </fieldset>
      <div class="actions" id="product-actions" hidden>
        <button type="button" class="primary" data-next="1">下一步：选风格</button>
      </div>
    </section>

    <section id="style" class="stage" data-panel aria-labelledby="style-title" hidden>
      <h2 id="style-title" tabindex="-1">选择风格</h2>
      <fieldset id="style-fields" aria-label="选择风格">
        <fieldset class="source-options">
          <legend>风格来源</legend>
          <label><input type="radio" name="style-source" value="prompt" checked>文字生成</label>
          <label><input type="radio" name="style-source" value="reference">上传参考图</label>
        </fieldset>
        <div id="prompt-panel">
          <form id="style-form" autocomplete="off">
            <label for="style-prompt">风格描述</label>
            <div class="prompt-controls">
              <input id="style-prompt" type="text" maxlength="100" placeholder="例如：冷银灰背景，柔和侧光">
              <button type="submit" class="primary">生成风格图</button>
            </div>
          </form>
          <div id="style-candidates" class="candidates" aria-label="风格候选"></div>
        </div>
        <div class="upload" id="reference-panel" hidden>
          <div>
            <label for="reference-file">风格参考图</label>
            <input id="reference-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="reference-status">
            <p id="reference-status" class="status" role="status">支持 PNG、JPEG、WebP。</p>
          </div>
          <img id="reference-preview" alt="已上传的风格参考图" hidden>
        </div>
        <p id="style-status" class="status" role="status"></p>
      </fieldset>
      <div class="actions">
        <button type="button" data-next="0">上一步</button>
        <button type="button" id="style-continue" class="primary" data-next="2" disabled>下一步：排版</button>
      </div>
    </section>

    <section id="template" class="stage" data-panel aria-labelledby="template-title" hidden>
      <h2 id="template-title" tabindex="-1">排版与出图</h2>
      <form id="detail-form">
        <fieldset id="template-fields" aria-label="详情图设置">
          <div class="batch-toolbar preset-toolbar">
            <div class="preset-control">
              <label for="detail-preset">载入预设</label>
              <select id="detail-preset" aria-describedby="preset-status"></select>
            </div>
            <button id="optimize-template" type="button" disabled>根据模板优化</button>
          </div>
          <p id="preset-status" class="status" role="status"></p>
          <div class="batch-toolbar">
            <div class="batch-controls">
              <div>
                <label for="image-count">图片张数</label>
                <select id="image-count"></select>
              </div>
              <div>
                <label for="image-ratio">统一图片比例</label>
                <select id="image-ratio"></select>
              </div>
            </div>
            <button id="generate-button" type="submit" class="primary">生成全部</button>
          </div>
          <p id="batch-help" class="status">载入预设，或手动选择张数和比例。</p>
          <p id="generate-status" class="status" role="status"></p>
          <div id="image-rows"></div>
          <div class="actions"><button type="button" data-next="1">上一步</button></div>
        </fieldset>
      </form>
    </section>
  </main>
  <template id="image-row-template">
    <section class="image-row">
      <div class="detail-fields">
        <h3 class="image-title"></h3>
        <div>
          <label>生图提示词</label>
          <textarea data-field="prompt" rows="3" maxlength="180" placeholder="例如：黑曜石背景，侧光，银饰特写"></textarea>
        </div>
        <div>
          <label>图上文案</label>
          <textarea data-field="copy" rows="3" maxlength="120" placeholder="填写实际要印在这张图上的文字"></textarea>
        </div>
      </div>
      <figure class="detail-preview">
        <div class="preview-toolbar">
          <button type="button" class="regenerate">生成此图</button>
          <a class="download">下载 PNG</a>
        </div>
        <div class="preview-surface">
          <p class="preview-empty status">待生成</p>
          <img class="detail-preview-image" alt="" hidden>
        </div>
        <figcaption>
          <span class="preview-dimensions" hidden></span>
          <p class="preview-message status" role="status"></p>
        </figcaption>
      </figure>
    </section>
  </template>
</body>
</html>
