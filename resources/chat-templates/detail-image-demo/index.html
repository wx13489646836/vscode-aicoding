<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>银饰详情图工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="shell topbar">
      <h1>银饰详情图</h1>
      <p class="version">本地演示 <strong id="version">载入中</strong></p>
    </div>
  </header>
  <p id="app-status" class="shell app-status" role="status"></p>
  <main id="studio" class="shell" hidden>
    <nav aria-label="制作步骤">
      <ol class="step-list">
        <li><button type="button" data-step="0"><span aria-hidden="true">01</span>商品图</button></li>
        <li><button type="button" data-step="1"><span aria-hidden="true">02</span>选风格</button></li>
        <li><button type="button" data-step="2"><span aria-hidden="true">03</span>排版</button></li>
        <li><button type="button" data-step="3"><span aria-hidden="true">04</span>下载</button></li>
      </ol>
    </nav>
    <section id="product" class="stage" data-panel aria-labelledby="product-title">
      <h2 id="product-title" tabindex="-1">上传商品图</h2>
      <fieldset id="product-fields" class="upload" aria-label="商品图片">
        <div>
          <label for="product-file">白底商品图</label>
          <input id="product-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="product-status">
          <p id="product-status" class="status" role="status">支持 PNG、JPEG、WebP。</p>
        </div>
        <img id="product-preview" alt="已上传的商品图" hidden>
      </fieldset>
      <div class="actions" id="product-actions" hidden>
        <button type="button" class="primary" data-next="1">下一步：选风格</button>
      </div>
    </section>

    <section id="style" class="stage" data-panel aria-labelledby="style-title" hidden>
      <h2 id="style-title" tabindex="-1">选择风格</h2>
      <fieldset id="style-fields" aria-label="选择风格">
        <fieldset class="source-options">
          <legend>风格来源</legend>
          <label><input type="radio" name="style-source" value="prompt" checked>文字生成</label>
          <label><input type="radio" name="style-source" value="reference">上传参考图</label>
        </fieldset>
        <div id="prompt-panel">
          <form id="style-form">
            <label for="style-prompt">风格描述</label>
            <div class="prompt-controls">
              <input id="style-prompt" type="text" maxlength="100" placeholder="例如：冷银灰背景，柔和侧光" required>
              <button type="submit" class="primary">生成风格图</button>
            </div>
          </form>
          <div id="style-candidates" class="candidates" aria-label="风格候选"></div>
        </div>
        <div class="upload" id="reference-panel" hidden>
          <div>
            <label for="reference-file">风格参考图</label>
            <input id="reference-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="reference-status">
            <p id="reference-status" class="status" role="status">支持 PNG、JPEG、WebP。</p>
          </div>
          <img id="reference-preview" alt="已上传的风格参考图" hidden>
        </div>
        <p id="style-status" class="status" role="status"></p>
      </fieldset>
      <div class="actions">
        <button type="button" data-next="0">上一步</button>
        <button type="button" id="style-continue" class="primary" data-next="2" disabled>下一步：排版</button>
      </div>
    </section>

    <section id="template" class="stage" data-panel aria-labelledby="template-title" hidden>
      <h2 id="template-title" tabindex="-1">排版详情图</h2>
      <form id="detail-form">
        <fieldset id="template-fields" aria-label="详情图设置">
          <div class="count-control">
            <label for="image-count">图片张数</label>
            <select id="image-count"></select>
          </div>
          <div id="image-settings" class="image-settings"></div>
          <p id="generate-status" class="status" role="status"></p>
          <div class="actions">
            <button type="button" data-next="1">上一步</button>
            <button type="submit" class="primary">生成详情图</button>
          </div>
        </fieldset>
      </form>
    </section>

    <section id="output" class="stage" data-panel aria-labelledby="output-title" hidden>
      <h2 id="output-title" tabindex="-1">预览与下载</h2>
      <p id="output-status" class="status" role="status"></p>
      <div id="result-list" class="result-list"></div>
      <div class="actions">
        <button type="button" data-next="2">返回排版</button>
      </div>
    </section>
  </main>
</body>
</html>
